services:
  postgres:
    image: postgres:16
    container_name: gridsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridsense}
      POSTGRES_USER: ${POSTGRES_USER:-gridsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports: ["5432:5432"]
    volumes: [gridsense_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridsense_user} -d ${POSTGRES_DB:-gridsense}"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gridsense-qdrant
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes: [gridsense_qdrant_data:/qdrant/storage]
volumes:
  gridsense_postgres_data:
  gridsense_qdrant_data:
