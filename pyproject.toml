[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsense-ai"
version = "0.1.0"
description = "Time-series econometrics and agentic electricity supply intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
"numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12", "matplotlib>=3.8",
"seaborn>=0.13", "plotly>=5.20", "statsmodels>=0.14.2", "arch>=7.0",
"scikit-learn>=1.4", "xgboost>=2.0", "patsy>=0.5", "SQLAlchemy>=2.0",
"psycopg[binary]>=3.1", "python-dotenv>=1.0", "PyYAML>=6.0",
"requests>=2.31", "tqdm>=4.66", "fastapi>=0.110", "uvicorn[standard]>=0.27",
"pydantic>=2.6", "langchain>=0.2", "langgraph>=0.2", "qdrant-client>=1.9",
"mlflow>=2.12"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "jupyterlab>=4",
"ipykernel>=6", "httpx>=0.27"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
